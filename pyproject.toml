[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mastro-orchestrator-adapter"
version = "1.0.0"
description = "Replaceable infrastructure adapter for MASTRO"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["orchestrator*"]
namespaces = false

[tool.setuptools.package-data]
orchestrator = ["skills/*/SKILL.md", "*.md", ".env.example", "requirements.txt"]
